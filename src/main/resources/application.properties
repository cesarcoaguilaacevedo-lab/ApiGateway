spring.application.name=api-gateway
server.port=8080
spring.config.import=configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].id=socios-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://socios-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/socios/**
spring.cloud.gateway.server.webflux.routes[2].id=puestos-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://puestos-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/puestos/**,/api/giros/**
spring.cloud.gateway.server.webflux.routes[3].id=cobranzas-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://cobranzas-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cuentas-por-cobrar/**,/api/servicios/**
spring.cloud.gateway.server.webflux.routes[4].id=pagos-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://pagos-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/recibos/**,/api/bancos/**
spring.cloud.gateway.server.webflux.routes[5].id=egresos-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://egresos-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/egresos/**

# Reportes Excel de pagos-service
spring.cloud.gateway.server.webflux.routes[6].id=reportes-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://pagos-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/reportes/**
